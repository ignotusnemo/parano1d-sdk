[package]
name = "parano1d-authorization"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Enable browser entropy when linking through wasm-bindgen.
browser-rng = ["dep:getrandom", "getrandom/js"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
noid_core = { path = "../../vendor/noid_core" }
noid_gkr = { path = "../../vendor/noid_gkr" }
noid_tx = { path = "../../vendor/noid_tx" }
noid_poseidon2b = { path = "../../vendor/noid_poseidon2b" }
blake3 = { version = "1", default-features = false, features = ["pure"] }

url = "2"
bincode = "1.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", optional = true }

[dev-dependencies]
rand = "0.8"
